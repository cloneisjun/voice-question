<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="VoiceQuestion">
  <title>VoiceQuestion</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26244A"/>
      <stop offset="1" stop-color="#121124"/>
    </linearGradient>
    <linearGradient id="wave" gradientUnits="userSpaceOnUse" x1="72" y1="0" x2="440" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="#fff" stroke-opacity="0.1" stroke-width="4"/>
  <!-- the voice: level bars on both sides -->
  <g fill="url(#wave)">
    <rect x="72" y="208" width="32" height="96" rx="16"/>
    <rect x="126" y="160" width="32" height="192" rx="16"/>
    <rect x="354" y="160" width="32" height="192" rx="16"/>
    <rect x="408" y="208" width="32" height="96" rx="16"/>
  </g>
  <!-- the question -->
  <path d="M201 187a55 55 0 1 1 90.4 42.1C271 247 256 260 256 288v16" fill="none" stroke="#fff" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="256" cy="372" r="26" fill="#fff"/>
</svg>
